# Gate de qualidade no CI (P1-02, S8 · Confiança Comprovável).
# Roda o MESMO ritual que o desenvolvimento local já usa (`bun run gate`:
# testes + paridade de schema + typecheck + varredura de segredo) + build de
# produção, em cada push e PR na main.
#
# NENHUMA credencial real, e agora por construção e não por convenção: o
# ambiente do job é inerte (VITALOS_DB_TARGET=test com URLs sob .invalid, que
# por RFC 2606 nunca resolvem). O contrato de ambiente recusa `ci` combinado
# com qualquer alvo que não seja `test`, então este job não alcança staging
# nem produção mesmo que alguém adicione uma secret por engano.
#
# O CI roda `build:ci`, NÃO o `build` — este último é o contrato de produção
# do Lovable e usa o `.env` público versionado. As variáveis do job abaixo
# sobrescrevem esse `.env`: verificado empiricamente que o `process.env` vence
# os arquivos `.env` no Vite, então o bundle de CI sai com valor inerte e
# nenhum vestígio de produção.
#
# O build vem ANTES do gate de propósito: a varredura de segredo inclui o
# artefato servido ao navegador, e artefato só existe depois do build.
#
# bun-version FIXO (não "latest"): "latest" já causou um incidente real —
# `bun test src` passava limpo localmente mas falhava deterministicamente
# aqui, porque uma versão mais nova do bun tinha timing diferente de
# mock.module()/afterAll entre arquivos de teste (achado e corrigido via
# injeção de dependência em wave-admin.server.test.ts; ver PR #26). Fixar a
# mesma versão usada localmente elimina essa classe inteira de divergência
# CI-vs-local. Atualizar aqui só de propósito, testando localmente primeiro.
#
# Nota Lovable: os commits automáticos do bot (gpt-engineer-app[bot]) também
# passam por aqui — se o Lovable quebrar o gate, o X vermelho aparece no
# GitHub, que é exatamente a "falha visível" que queremos.

name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Contrato de ambiente — a única combinação que o CI pode assumir.
  VITALOS_RUNTIME_ENV: ci
  VITALOS_DB_TARGET: test
  # Alvos inertes: .invalid não resolve. Nenhuma chamada de rede é possível.
  # Sobrescrevem o `.env` versionado (process.env vence arquivo no Vite).
  SUPABASE_URL: https://ci.invalid
  VITE_SUPABASE_URL: https://ci.invalid
  SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
  VITE_APP_URL: https://app.ci.invalid
  # Piloto FIB-T desligado: depende de migrations não aplicadas em produção.
  VITE_FIBT_PILOT_ENABLED: "false"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Registrar versão do bun (rastreabilidade CI vs local)
        run: bun --version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build de CI (inerte — nunca o build produtivo do Lovable)
        run: bun run build:ci

      - name: Gate (testes + paridade + typecheck + varredura de segredo)
        run: bun run gate

      - name: Varredura de segredo exigindo o artefato (não pode ser pulada)
        run: bun run scripts/build-secret-scan.ts --require-artifact
