# Supabase LOCAL descartável da demonstração IVO (macro-onda R5/R6).
#
# Copiado por scripts/ivo-local-demo.ts para .ivo-demo.local/supabase/config.toml
# (diretório ignorado pelo git). Nunca aponta para projeto remoto: não há
# project ref aqui, só um nome de container local e portas 55xxx próprias, para
# não colidir com outros stacks locais da máquina.

project_id = "vitalos-ivo-local"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55424

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:*/**", "http://127.0.0.1:*/**"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
email_sent = 100

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
max_frequency = "1s"
